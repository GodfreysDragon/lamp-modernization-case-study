name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  modern:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modern
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql
          coverage: pcov

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: modern/package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies and build
        run: npm ci && npm run build

      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Pest (with coverage)
        run: php artisan test --coverage

      - name: Vitest
        run: npm test
        env:
          # laravel-vite-plugin blocks dev-server startup under CI; Vitest reuses that config
          LARAVEL_BYPASS_ENV_CHECK: 1

  legacy-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Syntax-check legacy PHP
        run: find legacy -name '*.php' -print0 | xargs -0 -n1 php -l
